substitutions:
  # Must match a target defined in firebase.json
  _FIREBASE_TARGET: production

steps:
  - id: install-deps
    name: node:22-alpine
    entrypoint: sh
    args:
      - -c
      - |
        corepack enable
        corepack prepare pnpm@10.12.1 --activate
        pnpm install --frozen-lockfile

  - id: build-frontend
    name: node:22-alpine
    entrypoint: sh
    env:
      - 'NODE_OPTIONS=--max-old-space-size=4096'
    args:
      - -c
      - |
        corepack enable
        pnpm --filter frontend run copy
        pnpm --filter frontend run gen-schema
        # Vite build-time env vars — src/lib/firebase.ts calls initializeApp()
        # and getAnalytics() at module load with these; without them the app
        # crashes on load (blank page) before React ever renders. These are
        # NOT secrets — Firebase web SDK config is meant to be public/embedded
        # in the client bundle.
        export VITE_FIREBASE_API_KEY="AIzaSyASBdDAM0vk0VfyVdSuZ3_bFQEFVRjKuKs"
        export VITE_FIREBASE_AUTH_DOMAIN="gcp-project-502409.firebaseapp.com"
        export VITE_FIREBASE_PROJECT_ID="gcp-project-502409"
        export VITE_FIREBASE_STORAGE_BUCKET="gcp-project-502409.firebasestorage.app"
        export VITE_FIREBASE_MESSAGING_SENDER_ID="768575634176"
        export VITE_FIREBASE_APP_ID="1:768575634176:web:bc3de3c383144db2ac51e5"
        # TODO: update once backend is deployed and its real Cloud Run URL is known.
        export VITE_BASE_URL="https://REPLACE_WITH_BACKEND_URL/api"
        export VITE_IS_RECAPTCHA_ENABLED="false"
        pnpm --filter frontend build

  - id: deploy-hosting
    name: node:22-alpine
    entrypoint: sh
    args:
      - -c
      - |
        corepack enable
        npx firebase-tools@latest deploy \
          --only hosting:${_FIREBASE_TARGET} \
          --project ${PROJECT_ID} \
          --non-interactive

options:
  logging: CLOUD_LOGGING_ONLY
  # Default Cloud Build machine doesn't have enough RAM for this frontend's
  # heavy ML dependencies (tensorflow/mediapipe/onnxruntime) during bundling.
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100

timeout: 1800s
