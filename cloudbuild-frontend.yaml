substitutions:
  # Must match a target defined in firebase.json
  _FIREBASE_TARGET: production

steps:
  - id: install-deps
    name: node:22-alpine
    entrypoint: sh
    args:
      - -c
      - |
        corepack enable
        corepack prepare pnpm@10.12.1 --activate
        pnpm install --frozen-lockfile

  - id: build-frontend
    name: node:22-alpine
    entrypoint: sh
    args:
      - -c
      - |
        corepack enable
        # frontend's own "copy" script has a relative-path bug (goes up 2
        # dirs from backend/ instead of 1, landing outside /workspace) — bug
        # flagged to dev team separately. Bypassing it here with a correct
        # explicit path so the generator (currently a stub, also flagged)
        # writes to where gen-schema actually expects to find it.
        node backend/scripts/generate-openapi.cjs --output frontend/openapi.json
        pnpm --filter frontend run gen-schema
        # TEMPORARY (Option A unblock, see email to dev team re: OpenAPI stub +
        # pre-existing TS errors): skip `tsc -b` strict type-check and go
        # straight to `vite build`. Runtime behavior is unaffected — this only
        # skips a build-time safety check. Revert to `pnpm --filter frontend build`
        # once the dev team fixes the schema generator and the ~15 type errors.
        # Heavy ML deps (tensorflow/mediapipe/onnxruntime) need a raised heap
        # limit — default V8 heap (~2GB) isn't enough for this bundle.
        export NODE_OPTIONS="--max-old-space-size=8192"
        # Vite build-time env vars — src/lib/firebase.ts calls initializeApp()
        # and getAnalytics() at module load with these; without them the app
        # crashes on load (blank page) before React ever renders. These are
        # NOT secrets — Firebase web SDK config is meant to be public/embedded
        # in the client bundle.
        export VITE_FIREBASE_API_KEY="AIzaSyASBdDAM0vk0VfyVdSuZ3_bFQEFVRjKuKs"
        export VITE_FIREBASE_AUTH_DOMAIN="gcp-project-502409.firebaseapp.com"
        export VITE_FIREBASE_PROJECT_ID="gcp-project-502409"
        export VITE_FIREBASE_STORAGE_BUCKET="gcp-project-502409.firebasestorage.app"
        export VITE_FIREBASE_MESSAGING_SENDER_ID="768575634176"
        export VITE_FIREBASE_APP_ID="1:768575634176:web:bc3de3c383144db2ac51e5"
        # TODO: update once backend is deployed and its real Cloud Run URL is known.
        export VITE_BASE_URL="https://REPLACE_WITH_BACKEND_URL/api"
        export VITE_IS_RECAPTCHA_ENABLED="false"
        pnpm --filter frontend exec vite build

  - id: deploy-hosting
    name: node:22-alpine
    entrypoint: sh
    args:
      - -c
      - |
        corepack enable
        npx firebase-tools@latest deploy \
          --only hosting:${_FIREBASE_TARGET} \
          --project ${PROJECT_ID} \
          --non-interactive

options:
  logging: CLOUD_LOGGING_ONLY
  # Default Cloud Build machine doesn't have enough RAM for this frontend's
  # heavy ML dependencies (tensorflow/mediapipe/onnxruntime) during bundling.
  machineType: E2_HIGHCPU_8

timeout: 1800s
