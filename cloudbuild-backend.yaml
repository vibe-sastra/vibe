substitutions:
  _REGION: asia-south1
  _AR_REPO: vibe-backend
  _SERVICE_NAME: vibe-backend-production
  _NODE_ENV: production

steps:
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:latest
      - -f
      - backend/Dockerfile
      - backend

  - id: docker-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      # Non-sensitive vars with known-safe values, set directly.
      # APP_URL is still a placeholder — it's this service's OWN Cloud Run
      # URL, which we won't know until after the first backend deploy.
      # Update it once and redeploy after seeing the assigned Cloud Run URL.
      - --set-env-vars=NODE_ENV=${_NODE_ENV},APP_MODULE=all,APP_ROUTE_PREFIX=/api,DB_NAME=vibe,IS_RECAPTCHA_ENABLED=false,ENABLE_DB_BACKUP=false,ENABLE_HP_JOB=false,AI_PROXY_ADDRESS=socks5h://localhost:1055,APP_ORIGINS=https://gcp-project-502409.web.app,FRONTEND_URL=https://gcp-project-502409.web.app,APP_URL=REPLACE_WITH_BACKEND_URL
      # Only truly sensitive / required-with-no-default values go through Secret Manager.
      - --set-secrets=ADMIN_PASSWORD=ADMIN_PASSWORD:latest,DB_URL=DB_URL:latest

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:latest

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
